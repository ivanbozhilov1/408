services:
  picks:
    build: .
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    ports:
      - "127.0.0.1:8740:8080"
    environment:
      PICKS_PORT: "8080"
      PICKS_DATA_DIR: /data
      PICKS_AUTH_FILE: /app/auth.json
      PICKS_CATALOG_FILE: /app/catalog.json
      PICKS_ALLOWED_ORIGIN: https://ivanbozhilov1.github.io
    volumes:
      - picks-data:/data
      - ./server.py:/app/server.py:ro
      - ./auth.json:/app/auth.json:ro
      - ./catalog.json:/app/catalog.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  picks-data:
